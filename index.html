<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Braintree Custom Checkout (Hosted Fields)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 14px; font-size: 14px; font-weight: 600; }
    .hosted-field { border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; margin-top: 6px; height: 20px; }
    .hosted-field.braintree-hosted-fields-focused { border-color: #0070ba; }
    .hosted-field.braintree-hosted-fields-invalid { border-color: #b3261e; }
    input[type="text"] { width: 100%; padding: 10px 12px; box-sizing: border-box; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #0070ba; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 20px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
    #result.success { background: #e6f4ea; color: #1e7a34; display: block; }
    #result.error { background: #fdecea; color: #b3261e; display: block; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>
  <h1>Custom Checkout (Hosted Fields)</h1>

  <label for="amount">Amount (USD)</label>
  <input type="text" id="amount" value="10.00" />

  <label for="cardholder-name">Cardholder Name</label>
  <input type="text" id="cardholder-name" placeholder="Jane Doe" />

  <label>Card Number</label>
  <div id="card-number" class="hosted-field"></div>

  <div class="row">
    <div>
      <label>Expiration Date</label>
      <div id="expiration-date" class="hosted-field"></div>
    </div>
    <div>
      <label>CVV</label>
      <div id="cvv" class="hosted-field"></div>
    </div>
  </div>

  <button id="submit-button">Pay Now</button>
  <div id="result"></div>

  <script src="https://js.braintreegateway.com/web/3.107.0/js/client.min.js"></script>
  <script src="https://js.braintreegateway.com/web/3.107.0/js/hosted-fields.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
